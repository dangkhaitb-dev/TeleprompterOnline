name: deploy

on:
  push:
    branches: [test, product]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve env
        id: vars
        run: |
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" = "product" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "site_url=https://vteleprompter.com" >> "$GITHUB_OUTPUT"
          else
            echo "env=test" >> "$GITHUB_OUTPUT"
            echo "site_url=https://test.vteleprompter.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Login registry
        run: echo "${{ secrets.REGISTRY_PASS }}" | docker login registry.vidtool.net -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build & push image
        run: |
          TAG="${{ steps.vars.outputs.sha7 }}-${{ steps.vars.outputs.env }}"
          IMG="registry.vidtool.net/vprompter/vprompter:$TAG"
          docker build --build-arg SITE_URL="${{ steps.vars.outputs.site_url }}" -t "$IMG" .
          docker push "$IMG"

      - name: Deploy on server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 65.108.67.201 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 deploy@65.108.67.201 \
            "/opt/apps/vprompter/deploy.sh ${{ steps.vars.outputs.env }} ${{ steps.vars.outputs.sha7 }}-${{ steps.vars.outputs.env }}"
