<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The page you requested does not exist or may have moved.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light">
    <title>Page not found</title>
    
<script>if ("scrollRestoration" in history) history.scrollRestoration = "manual";</script><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256x256.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <link rel="stylesheet" href="/src/styles/reset.css">
    <link rel="stylesheet" href="/src/styles/tokens.css">
    <link rel="stylesheet" href="/src/styles/main.css">
</head>

<body>
    <main class="stage" id="main" tabindex="-1">
    <a class="stage__brand" href="/" aria-label="Return to SolPrompter">
        <img src="/logo.webp" alt="" width="36" height="36">
    </a>

    <div class="stage__content">
        <div class="stage__heading">
            <p class="stage__eyebrow">404 · Not found</p>
            <h1 class="stage__title">Page not found</h1>
        </div>

        <div class="stage__support">
            <p class="stage__lead">The page you requested does not exist or may have moved.</p>
            <a class="stage__action" href="/">Return to SolPrompter</a>
        </div>
    </div>
</main>

    <aside
    class="feedback-widget"
    data-feedback-widget
    data-feedback-pending="Sending…"
    data-feedback-success="Thanks — your feedback has been sent."
    data-feedback-error="We couldn&#39;t send your feedback. Please try again."
    data-feedback-email-required="Enter your email address."
    data-feedback-email-invalid="Enter a valid email address."
    data-feedback-content-required="Enter your feedback."
    data-feedback-content-too-short="Feedback must be at least 3 characters."
    data-feedback-content-too-long="Feedback must be no more than 5000 characters."
>
    <section
        class="feedback-widget__dialog"
        id="feedback-dialog"
        data-feedback-dialog
        role="dialog"
        aria-labelledby="feedback-title"
        hidden
    >
        <header class="feedback-widget__header">
            <div>
                <p class="feedback-widget__eyebrow">Help us improve</p>
                <h2 class="feedback-widget__title" id="feedback-title">Send feedback</h2>
            </div>
            <button
                class="feedback-widget__close"
                type="button"
                data-feedback-close
                data-analytics-name="feedbackCloseClick"
                aria-label="Close feedback form"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12M18 6 6 18" />
                </svg>
            </button>
        </header>

        <form class="feedback-widget__form" data-feedback-form novalidate>
            <div class="feedback-widget__field">
                <label for="feedback-email">Email (optional)</label>
                <input
                    id="feedback-email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    maxlength="254"
                    placeholder="you@example.com"
                    aria-describedby="feedback-email-error"
                >
                <p
                    class="feedback-widget__field-error"
                    id="feedback-email-error"
                    data-feedback-email-error
                    hidden
                ></p>
            </div>

            <div class="feedback-widget__field">
                <div class="feedback-widget__label-row">
                    <label for="feedback-content">
                        Feedback<span class="feedback-widget__required" aria-hidden="true">*</span>
                    </label>
                </div>
                <textarea
                    id="feedback-content"
                    name="content"
                    rows="5"
                    minlength="3"
                    maxlength="5000"
                    placeholder="What worked well, or what should we improve?"
                    aria-describedby="feedback-content-error"
                    required
                ></textarea>
                <p
                    class="feedback-widget__field-error"
                    id="feedback-content-error"
                    data-feedback-content-error
                    hidden
                ></p>
            </div>

            <button
                class="feedback-widget__submit"
                type="submit"
                data-feedback-submit
                data-analytics-name="feedbackSubmitClick"
            >Send feedback</button>
            <p class="feedback-widget__status" data-feedback-status role="status" hidden></p>
        </form>
    </section>

    <button
        class="feedback-widget__trigger"
        type="button"
        data-feedback-open
        data-analytics-name="feedbackOpenClick"
        aria-expanded="false"
        aria-controls="feedback-dialog"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 5.75h14v9.5H9.5L5 19V5.75Z" />
            <path d="M8.5 9.25h7M8.5 12h4.5" />
        </svg>
        <span>Feedback</span>
    </button>
</aside>
<script type="module" src="/src/script/feedback-main.js"></script>

</body>

</html>
