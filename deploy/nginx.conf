server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Trả Location tương đối để giữ nguyên https khi đứng sau reverse proxy
    absolute_redirect off;

    location = /blog/inside-solprompter-every-ai-teleprompter-feature-tested {
        return 301 /blog/product/solprompter-ai-teleprompter-features-tested/;
    }

    location = /blog/inside-solprompter-every-ai-teleprompter-feature-tested/ {
        return 301 /blog/product/solprompter-ai-teleprompter-features-tested/;
    }

    location = /blog/product/inside-solprompter-every-ai-teleprompter-feature-tested {
        return 301 /blog/product/solprompter-ai-teleprompter-features-tested/;
    }

    location = /blog/product/inside-solprompter-every-ai-teleprompter-feature-tested/ {
        return 301 /blog/product/solprompter-ai-teleprompter-features-tested/;
    }

    location ~ ^/media/blog/inside-solprompter-every-ai-teleprompter-feature-tested/(.+)$ {
        return 301 /media/blog/solprompter-ai-teleprompter-features-tested/$1;
    }

    location / {
        # URL sạch: chỉ redirect khi client thật sự gõ .html
        # (dùng $request_uri để không dính rewrite nội bộ của "index index.html")
        if ($request_uri ~ ^/(.*/)?index(?:\.html)?(?:\?.*)?$) { return 301 /$1; }
        if ($request_uri ~ ^/(.+)\.html(?:\?.*)?$)              { return 301 /$1; }
        # URL không đuôi (/about) → serve file .html tương ứng
        try_files $uri $uri.html $uri/ =404;
    }
}
